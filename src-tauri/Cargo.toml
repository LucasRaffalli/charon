[package]
name = "charon"
version = "1.2.2"
description = "Client SFTP/FTP privé pour macOS"
authors = ["lucas"]
edition = "2021"

[lib]
name = "charon_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
# russh >= 0.62.5 requis : 13 advisories (dont 3 HIGH) corrigées depuis 0.45,
# plusieurs côté client (DoS/panique face à un serveur malveillant).
russh = "0.63.1"
russh-sftp = "2"
suppaftp = { version = "11", features = ["async-secure", "tokio", "tokio-async-native-tls"] }
futures-util = { version = "0.3", features = ["io"] }
tauri-plugin-store = "2"
thiserror = "2"
dirs = "6"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.23"
notify = "8"
sha2 = "0.11"
tauri-plugin-dialog = "2.7.3"

# Coffre à secrets natif : Keychain sur macOS, Credential Manager sur Windows.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Release : LTO + strip divisent presque le binaire par deux (26 -> ~15 Mo).
# panic reste "unwind" : tao et tokio rattrapent des panics (catch_unwind) ;
# en "abort", une panique dans une commande tuerait l'app entiere.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
