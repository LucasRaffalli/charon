[package]
name = "charon"
version = "1.1.0"
description = "Client SFTP/FTP privé pour macOS"
authors = ["lucas"]
edition = "2021"

[lib]
name = "charon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
# russh >= 0.62.5 requis : 13 advisories (dont 3 HIGH) corrigées depuis 0.45,
# plusieurs côté client (DoS/panique face à un serveur malveillant).
russh = "0.62.7"
russh-sftp = "2"
suppaftp = { version = "6", features = ["async-secure", "async-native-tls"] }
futures-util = { version = "0.3", features = ["io"] }
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-store = "2"
thiserror = "2"
dirs = "5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.22"
notify = "8"
