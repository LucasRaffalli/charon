[package]
name = "charon"
version = "0.1.0"
description = "Client SFTP/FTP privé pour macOS"
authors = ["lucas"]
edition = "2021"

[lib]
name = "charon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"
async-trait = "0.1"
suppaftp = { version = "6", features = ["async-secure", "async-native-tls"] }
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-store = "2"
thiserror = "2"
dirs = "5"
