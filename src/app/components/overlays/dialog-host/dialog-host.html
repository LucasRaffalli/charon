@if (dialog.state(); as state) {
  <app-modal role="alertdialog" [title]="state.title" [icon]="state.danger ? 'alert-circle' : null" (closed)="cancel()">
    <form class="dialog" (submit)="onSubmit($event)" (keydown.enter)="onSubmit($event)">
      @if (state.message) {
        <p class="dialog__message">{{ state.message }}</p>
      }
      @if (state.kind === 'prompt') {
        <app-text-field label="Nom" name="dialog-value" [autofocus]="true" [placeholder]="state.placeholder ?? ''" [(value)]="input" />
      }
      @if (state.acknowledge) {
        <!-- Le geste explicite qui remplace le mot à retaper pour un lot :
             un clic délibéré, sans exiger de saisie. -->
        <app-toggle [label]="state.acknowledge" [(checked)]="acknowledged" />
      }
    </form>

    <ng-container modal-foot>
      <span class="dialog__spacer"></span>
      <app-button variant="ghost" type="button" (click)="cancel()">{{ t('common.buttons.cancel') }}</app-button>
      <app-button
        [variant]="state.danger ? 'danger-solid' : 'primary'"
        type="button"
        [disabled]="!canSubmit()"
        (click)="onSubmit($event)"
      >
        {{ state.confirmLabel }}
      </app-button>
    </ng-container>
  </app-modal>
}
