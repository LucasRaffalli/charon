@if (edit.state(); as state) {
  <app-modal
    [title]="t('favorites.editTitle')"
    subtitle="Le nom et l'icône ne servent qu'ici : le dossier du serveur n'est pas touché."
    icon="anchor"
    size="md"
    (closed)="edit.close()"
  >
    <div class="edit" (keydown)="onKeydown($event)">
      <app-text-field [label]="t('favorites.name')" [placeholder]="t('favorites.namePlaceholder')" [autofocus]="true" [(value)]="label" />

      <div class="edit__field">
        <span class="edit__label">{{ t('favorites.icon') }}</span>
        <!-- Vide, la poignée choisie ; une saisie cherche dans tout le
             catalogue lucide, chargé à la première frappe. -->
        <app-input
          class="edit__search"
          [placeholder]="t('favorites.searchIcon')"
          [value]="iconQuery()"
          (valueChange)="onIconQuery($event)"
        />
        <div class="edit__icons">
          @for (name of icons(); track name) {
            <button
              type="button"
              class="edit__icon"
              [class.edit__icon--on]="icon() === name"
              [attr.aria-pressed]="icon() === name"
              [attr.aria-label]="name"
              (click)="icon.set(name)"
            >
              <app-icon [name]="name" [size]="15" />
            </button>
          }
        </div>
        @if (iconQuery().trim() && icons().length === 0) {
          <p class="edit__none">{{ t('favorites.noIcon') }}</p>
        }
      </div>

      <app-text-field label="Chemin" placeholder="/var/www" hint="Chemin absolu sur le serveur." [(value)]="path" />
    </div>

    <ng-container modal-foot>
      <app-button variant="ghost" (click)="remove()">{{ t('common.buttons.remove') }}</app-button>
      <span class="edit__spacer"></span>
      <app-button variant="ghost" (click)="edit.close()">{{ t('common.buttons.cancel') }}</app-button>
      <app-button variant="primary" [disabled]="!valid() || !dirty()" [loading]="saving()" (click)="apply()"> Enregistrer </app-button>
    </ng-container>
  </app-modal>
}
