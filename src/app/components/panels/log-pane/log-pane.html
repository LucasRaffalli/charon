@if (tail.path(); as path) {
  <div class="bar">
    <span class="bar__dot" [class.bar__dot--live]="tail.running()"></span>
    <span class="bar__path" [title]="path">{{ path }}</span>
    <input
      class="bar__filter"
      type="text"
      [placeholder]="t('logs.filter')"
      spellcheck="false"
      autocorrect="off"
      #filterInput
      [value]="filter()"
      (input)="filter.set(filterInput.value)"
    />
    @if (tail.running()) {
      <button type="button" class="bar__action" [title]="t('logs.stop')" (click)="tail.close()">
        <app-icon name="close" [size]="13" />
      </button>
    } @else {
      <button
        type="button"
        class="bar__action"
        [title]="t('logs.resume')"
        (click)="tail.open(path)"
      >
        <app-icon name="refresh" [size]="13" />
      </button>
    }
  </div>

  @if (tail.error(); as error) {
    <p class="notice notice--error">{{ error }}</p>
  }

  <div class="scroll" #scroller (scroll)="onScroll()">
    @for (line of visibleLines(); track line.seq) {
      <div class="line">{{ line.text }}</div>
    } @empty {
      <p class="notice">
        {{ t(filter() ? 'logs.noMatch' : 'logs.empty') }}
      </p>
    }
  </div>
} @else {
  <p class="notice">
    {{ t('logs.hint') }}
  </p>
}
