<div
  class="node"
  [class.node--active]="node().isDir && currentPath() === node().path"
>
  @if (node().isDir) {
    <button
      type="button"
      class="node__chevron"
      [class.node__chevron--expanded]="node().expanded"
      [class.node__chevron--loading]="node().loading"
      [attr.aria-label]="(node().expanded ? 'Replier ' : 'Déplier ') + node().name"
      [attr.aria-expanded]="node().expanded"
      (click)="tree.toggle(node())"
    >
      <app-icon name="chevron-right" [size]="12" />
    </button>
  } @else {
    <span class="node__chevron-space" aria-hidden="true"></span>
  }

  <button type="button" class="node__label" [title]="node().path" (click)="open()">
    <app-icon
      class="node__icon"
      [class.node__icon--file]="!node().isDir"
      [name]="node().isDir ? 'folder' : 'file'"
      [size]="14"
    />
    <span class="node__name">{{ node().name }}</span>
  </button>
</div>

@if (node().expanded) {
  <div class="node__children">
    @for (child of visibleChildren(); track child.path) {
      <app-server-tree-node [node]="child" [local]="local()" />
    } @empty {
      @if (node().error; as reason) {
        <!-- La lecture a échoué : on le DIT, à la place des enfants. Un
             chevron qui se referme sans un mot ne se diagnostique pas. -->
        <p class="node__empty node__empty--error" [title]="reason">
          {{ t('panes.tree.unreadable') }}
        </p>
      } @else if (!node().loading) {
        <p class="node__empty">{{ t('panes.tree.empty') }}</p>
      }
    }
  </div>
}
