@if (sftp.protocol() !== 'sftp') {
  <p class="notice">{{ t('terminal.sftpOnly') }}</p>
} @else {
  @if (error(); as message) {
    <p class="notice notice--error">{{ message }}</p>
  }
  @if (closed()) {
    <p class="notice notice--ended">
      <span>{{ t('terminal.ended') }}</span>
      <button type="button" class="notice__act" [disabled]="restarting()" (click)="restart()">
        {{ t('terminal.restart') }}
      </button>
    </p>
  }
  <div class="term-bar">
    <button
      type="button"
      class="term-follow"
      [class.term-follow--on]="following()"
      [attr.aria-pressed]="following()"
      [disabled]="closed()"
      title=""
      (click)="toggleFollow()"
    >
      {{ t('terminal.followDir') }}
    </button>
    @if (pending(); as path) {
      <span class="term-bar__wait" [title]="'Le shell est occupé : ' + path + ' partira dès qu\'il rendra la main.'">
        en attente
      </span>
    }
    <span class="term-bar__path">{{ sftp.currentPath() }}</span>
    <!-- La barre du terminal accueille les indicateurs qui parlent du dossier
         où l'on travaille. Git est le premier ; l'état vit dans un service de
         session, pas ici, pour que l'en-tête du panneau serveur montre le
         même sans le redemander. -->
    <app-git-chip [status]="session().git.status()" (opened)="openGitMenu($event)" />
  </div>

  <div class="term-frame">
    <div class="term" #term></div>
  </div>
}
