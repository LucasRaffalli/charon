@if (label()) {
  <span class="seg__label">{{ label() }}</span>
}

<div
  class="seg"
  role="radiogroup"
  [attr.aria-label]="ariaLabel() || null"
  [style.--seg-count]="options().length"
>
  <span
    class="seg__pill"
    aria-hidden="true"
    [style.transform]="'translateX(' + activeIndex() * 100 + '%)'"
  ></span>
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="seg__option"
      role="radio"
      [class.seg__option--active]="value() === option.value"
      [class.seg__option--danger]="option.tone === 'danger'"
      [attr.aria-checked]="value() === option.value"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
