<div class="switcher" role="radiogroup" aria-label="Thème">
  @for (option of options; track option.value) {
    <button
      type="button"
      class="switcher__option"
      role="radio"
      [class.switcher__option--active]="themeService.theme() === option.value"
      [attr.aria-checked]="themeService.theme() === option.value"
      [attr.aria-label]="'Thème ' + option.label"
      [title]="'Thème ' + option.label"
      (click)="themeService.select(option.value)"
    >
      <app-icon [name]="option.icon" [size]="15" />
    </button>
  }
</div>
