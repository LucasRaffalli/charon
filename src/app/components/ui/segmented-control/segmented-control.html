@if (label()) {
  <span class="seg__label">{{ label() }}</span>
}

<div #track class="seg" role="radiogroup" [attr.aria-label]="ariaLabel() || null">
  <span
    class="seg__pill"
    aria-hidden="true"
    [style.transform]="'translateX(' + pill().left + 'px)'"
    [style.width.px]="pill().width"
  ></span>
  @for (option of options(); track option.value) {
    <button
      #segment
      type="button"
      class="seg__option"
      role="radio"
      [class.seg__option--active]="value() === option.value"
      [class.seg__option--danger]="option.tone === 'danger'"
      [attr.aria-checked]="value() === option.value"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
