<label class="field">
  @if (label()) {
    <span class="field__label">{{ label() }}</span>
  }
  <input
    class="field__input"
    [type]="type()"
    [name]="name()"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    spellcheck="false"
    autocorrect="off"
    autocapitalize="off"
    [attr.aria-label]="ariaLabel() || null"
    [attr.autofocus]="autofocus() ? '' : null"
    [value]="value()"
    (input)="onInput($event)"
  />
  @if (hint()) {
    <span class="field__hint">{{ hint() }}</span>
  }
</label>
