<label class="field">
  @if (label()) {
    <span class="field__label">{{ label() }}</span>
  }
  <app-input
    class="field__input"
    [type]="type()"
    [name]="name()"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    [ariaLabel]="ariaLabel()"
    [autofocus]="autofocus()"
    [(value)]="value"
  />
  @if (hint()) {
    <span class="field__hint">{{ hint() }}</span>
  }
</label>
