<button
  type="button"
  class="toggle"
  role="switch"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="ariaLabel() || null"
  (click)="toggle()"
>
  @if (label()) {
    <span class="toggle__label">{{ label() }}</span>
  }
  <span class="toggle__track" [class.toggle__track--on]="checked()">
    <span class="toggle__thumb"></span>
  </span>
</button>
